services:
  postgres:
    image: postgres:16-alpine
    container_name: etnof-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: etnof
      POSTGRES_PASSWORD: etnof_dev_password
      POSTGRES_DB: etnof_cms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
